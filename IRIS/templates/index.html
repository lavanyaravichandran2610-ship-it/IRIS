    $api('/auth/logout',{method:'POST',body:'{}'}).catch(()=>{});
    setSession(null);USER=null;S=null;projectId=null;UI.sel=null;UI.draft={};UI.venueView=null;AUTH.step='form';AUTH.mode='signin';AUTH.err='';go('home');toast('Signed out');
  };

  // Discover uses live Crossref records through the server, with original DOI/publisher links.
  PAGES.discover=function(el){
    el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Discover · Live search</span><h1>Search scholarly papers from Crossref.</h1><p class="muted">Results are retrieved from bibliographic records when the server has internet access. Open the DOI or publisher source before citing.</p></div></div>
    <section class="card pad"><form id="live-search" style="display:flex;gap:10px;flex-wrap:wrap"><input id="live-q" type="search" style="flex:1;min-width:200px" placeholder="Search a topic, title, author or DOI" value="${esc2(UI.q||'')}" required><button class="btn primary" type="submit">Search papers</button></form><p id="search-status" class="note" style="margin-top:12px">Enter a query to search the scholarly index.</p></section><div id="live-results" class="papers" style="margin-top:16px"></div>
    <section class="card pad" style="margin-top:16px"><h3 class="h3d">Saved in this workspace</h3><div id="saved-papers">${(S.serverPapers||[]).map((p,i)=>`<div class="doc"><div><b>${esc2(p.title)}</b><small>${esc2(p.authors||'Authors unavailable')} · ${esc2(p.year||'Year unavailable')}</small></div><a href="${esc2(p.url||'#')}" target="_blank" rel="noopener">Open source ↗</a></div>`).join('')||'<p class="muted">Save a search result to build your paper library.</p>'}</div></section>`;
    const form=$('#live-search');
    async function search(q){const status=$('#search-status'),out=$('#live-results');status.textContent='Searching Crossref and checking the local reference set…';out.innerHTML='';try{const data=await $api('/papers?q='+encodeURIComponent(q));const papers=data.papers||[];status.textContent=`${papers.length} results · ${data.source||'Bibliographic search'}`;out.innerHTML=papers.length?papers.map((p,i)=>`<article class="card paper"><h3>${esc2(p.title)}</h3><div class="meta"><span>${esc2(p.authors||'Authors unavailable')}</span><span>·</span><span>${esc2(p.venue||'Publication unavailable')} ${esc2(p.year||'')}</span></div><p class="sum">${esc2(p.abstract||'No abstract was supplied in the bibliographic record.')}</p><div class="row"><div class="links">${p.url?`<a href="${esc2(p.url)}" target="_blank" rel="noopener">Open DOI / source ↗</a>`:''}</div><button class="btn sm primary" data-live-save="${i}">Save paper</button></div></article>`).join(''):'<div class="card pad muted">No results found. Try broader keywords.</div>';out.querySelectorAll('[data-live-save]').forEach(b=>b.addEventListener('click',()=>{const p=papers[Number(b.dataset.liveSave)];S.serverPapers=S.serverPapers||[];if(!S.serverPapers.some(x=>x.title===p.title)){S.serverPapers.push(p);save();$('#saved-papers').innerHTML=S.serverPapers.map(x=>`<div class="doc"><div><b>${esc2(x.title)}</b><small>${esc2(x.authors||'Authors unavailable')} · ${esc2(x.year||'Year unavailable')}</small></div><a href="${esc2(x.url||'#')}" target="_blank" rel="noopener">Open source ↗</a></div>`).join('');}b.textContent='Saved';b.disabled=true;toast('Paper saved to your workspace');}));}catch(e){status.textContent='Search failed: '+e.message;}}
    form.addEventListener('submit',e=>{e.preventDefault();UI.q=$('#live-q').value.trim();search(UI.q);});if(UI.q)search(UI.q);
  };

  // Copilot requests a real backend response; Ollama can be enabled in the server environment.
  PAGES.copilot=function(el){
    const history=S.serverChat||[];
    el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Research Copilot</span><h1>Ask, compare, and plan with research context.</h1><p class="muted">Uses a local Ollama model when configured; otherwise returns a clearly labelled retrieval-based response.</p></div></div><section class="card pad"><label class="f" for="copilot-context">Optional research context / paper excerpts<textarea id="copilot-context" rows="4" placeholder="Paste an abstract, research question, or findings to ground the answer">${esc2(S.serverContext||'')}</textarea></label><div id="copilot-thread" style="display:grid;gap:12px;margin:16px 0">${history.map(m=>`<article class="card pad"><b>${m.role==='user'?'You':'IRIS Copilot'}</b><p style="white-space:pre-wrap;margin-top:8px">${esc2(m.text)}</p>${m.mode?`<small class="muted">Mode: ${esc2(m.mode)}</small>`:''}</article>`).join('')||'<p class="muted">Your conversation will appear here.</p>'}</div><form id="copilot-form"><label class="f" for="copilot-question">Your question<textarea id="copilot-question" rows="3" required placeholder="e.g. Compare the methods and identify limitations…"></textarea></label><button class="btn primary" type="submit" style="margin-top:10px">Ask IRIS</button></form><p id="copilot-status" class="note" style="margin-top:10px"></p></section>`;
    $('#copilot-context').addEventListener('input',e=>{S.serverContext=e.target.value;save();});
    $('#copilot-form').addEventListener('submit',async e=>{e.preventDefault();const q=$('#copilot-question').value.trim();if(!q)return;const btn=e.submitter;btn.disabled=true;btn.textContent='Thinking…';$('#copilot-status').textContent='Request sent to the IRIS backend…';try{const data=await $api('/copilot',{method:'POST',body:json({question:q,context:$('#copilot-context').value})});S.serverChat=S.serverChat||[];S.serverChat.push({role:'user',text:q},{role:'assistant',text:data.answer,mode:data.mode});if(S.serverChat.length>40)S.serverChat=S.serverChat.slice(-40);log(S,'Copilot answered a research question ('+data.mode+')');save();renderPage();}catch(err){$('#copilot-status').textContent='Could not get an answer: '+err.message;btn.disabled=false;btn.textContent='Ask IRIS';}});
  };

  // Backend experiment engine trains actual scikit-learn models and stores the run in SQLite.
  PAGES.experiments=function(el){
    el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Experiment Engine · Server execution</span><h1>Run a reproducible model benchmark.</h1><p class="muted">Train on your own CSV dataset or use the clearly labelled synthetic fallback. For uploaded data, numeric feature columns are used and missing feature values are median-imputed.</p></div></div><div class="exp"><aside class="card ctrl"><h3>Dataset and model</h3><label class="f">Upload your dataset (.csv)<input id="server-csv" type="file" accept=".csv,text/csv"></label><button id="server-upload" class="btn" type="button">Upload CSV</button><p id="server-dataset-status" class="note" style="margin-top:8px">${S.uploadedDataset?`Loaded ${esc2(S.uploadedDataset.filename)} (${S.uploadedDataset.rows} rows).`:`No custom dataset selected; synthetic benchmark will be used.`}</p><label class="f">Target / label column<select id="server-target" ${S.uploadedDataset?'':'disabled'}>${S.uploadedDataset?S.uploadedDataset.columns.map(c=>`<option value="${esc2(c)}" ${c===S.uploadedDataset.columns[S.uploadedDataset.columns.length-1]?'selected':''}>${esc2(c)}</option>`).join(''):'<option>Upload a CSV first</option>'}</select></label><label class="f">Model<select id="server-model"><option>Random Forest</option><option>Extra Trees</option><option>Gradient Boosting</option><option>Logistic Regression</option></select></label><label class="f">Random seed<input id="server-seed" type="number" min="1" max="99999" value="42"></label><label class="f">Test set share<select id="server-test"><option value="0.2">20%</option><option value="0.25" selected>25%</option><option value="0.3">30%</option><option value="0.4">40%</option></select></label><button id="server-run" class="btn primary">Train and evaluate</button><p id="server-exp-status" class="note" style="margin-top:10px"></p></aside><div id="server-exp-out"><div class="card pad muted">Run an experiment to see its metrics and confusion matrix.</div></div></div>`;
    $('#server-upload').addEventListener('click',async()=>{const f=$('#server-csv').files[0];if(!f){$('#server-dataset-status').textContent='Choose a CSV file first.';return;}const b=$('#server-upload');b.disabled=true;b.textContent='Uploading…';try{const fd=new FormData();fd.append('file',f);const res=await fetch('/api/datasets/upload',{method:'POST',credentials:'same-origin',body:fd});const d=await res.json();if(!res.ok)throw new Error(d.error||'Upload failed');S.uploadedDataset={id:d.dataset_id,filename:d.filename,columns:d.columns,rows:d.rows};save();$('#server-target').innerHTML=d.columns.map(c=>`<option value="${esc2(c)}" ${c===d.suggested_target?'selected':''}>${esc2(c)}</option>`).join('');$('#server-target').disabled=false;$('#server-dataset-status').textContent=`Loaded ${d.filename}: ${d.rows} rows, ${d.columns.length} columns. Select the label column, then run.`;toast('Dataset uploaded');}catch(err){$('#server-dataset-status').textContent='Upload failed: '+err.message;}finally{b.disabled=false;b.textContent='Upload CSV';}});
    $('#server-run').addEventListener('click',async()=>{const b=$('#server-run');b.disabled=true;b.textContent='Training on server…';$('#server-exp-status').textContent='The model is training and evaluating on a held-out test split.';try{const cfg={model:$('#server-model').value,seed:Number($('#server-seed').value)||42,test_size:Number($('#server-test').value)};if(S.uploadedDataset){cfg.dataset_id=S.uploadedDataset.id;cfg.target=$('#server-target').value;}const d=await $api('/experiments/run',{method:'POST',body:json(cfg)});const r=d.result;S.serverExperiments=S.serverExperiments||[];S.serverExperiments.unshift(r);log(S,'Server experiment completed: '+r.model+' F1 '+r.f1);save();const cm=r.confusion_matrix;$('#server-exp-out').innerHTML=`<div class="metrics">${[['Accuracy',r.accuracy],['Precision',r.precision],['Recall',r.recall],['F1 score',r.f1]].map(([n,v])=>`<div class="card metric"><span class="l">${n}</span><div class="v">${(v*100).toFixed(1)}%</div></div>`).join('')}</div><div class="card pad" style="margin-top:16px"><h3 class="h3d">Confusion matrix</h3><p class="muted">Rows = actual class; columns = predicted class.</p><div class="tscroll"><table class="t"><thead><tr><th>Actual / predicted</th>${cm.map((_,i)=>`<th>Class ${i}</th>`).join('')}</tr></thead><tbody>${cm.map((row,i)=>`<tr><th>Class ${i}</th>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:12px">Dataset: ${esc2(r.dataset)}. ${esc2(r.note)}</p></div>`;$('#server-exp-status').textContent='Experiment completed and saved to the database.';}catch(err){$('#server-exp-status').textContent='Experiment failed: '+err.message;}finally{b.disabled=false;b.textContent='Train and evaluate';}});
  };

  // Integrity actions execute server checks; rectification is conservative and re-check is explicit.
  PAGES.integrity=function(el){
    el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Integrity &amp; Novelty</span><h1>Check the manuscript, rectify, then revalidate.</h1><p class="muted">The server checks citation markers, references heading, length and sentence readability. It does not currently compare against a full-text plagiarism corpus or certify novelty.</p></div></div><div class="split"><section class="card editor"><div class="bar"><b>Manuscript editor</b><span id="server-word-count">0 words</span></div><textarea id="server-manuscript" rows="22" style="width:100%;min-height:420px">${esc2(S.manuscript||'')}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="server-check">Run integrity check</button><button class="btn" id="server-rectify">Apply safe corrections</button><button class="btn" id="server-recheck">Revalidate</button></div><p class="note">Safe correction currently cleans spacing and returns editorial recommendations. It does not fabricate sources or rewrite claims.</p></section><section id="server-integrity-report"><div class="card pad muted">Run a check to see findings.</div></section></div>`;
    const ta=$('#server-manuscript'),wc=()=>$('#server-word-count').textContent=(ta.value.trim().match(/\b[\w'-]+\b/g)||[]).length+' words';wc();ta.addEventListener('input',()=>{S.manuscript=ta.value;wc();save();});
    async function check(){const b=$('#server-check');b.disabled=true;b.textContent='Checking…';try{const d=await $api('/integrity/check',{method:'POST',body:json({manuscript:ta.value})});integrityLast=d.report;S.serverIntegrity=d.report;const r=d.report;$('#server-integrity-report').innerHTML=`<div class="card pad"><h3 class="h3d">${esc2(r.status)}</h3><div class="metrics" style="margin-top:12px">${[['Words',r.word_count],['Sentences',r.sentence_count],['Citation markers',r.citation_markers],['Reference heading',r.reference_heading_detected?'Found':'Missing']].map(([n,v])=>`<div class="card metric"><span class="l">${n}</span><div class="v" style="font-size:20px">${esc2(v)}</div></div>`).join('')}</div><h4 style="margin-top:16px">Findings</h4>${r.findings.length?r.findings.map(f=>`<article class="card pad" style="margin-top:8px"><b>${esc2(f.type)} · ${esc2(f.severity)}</b><p style="margin-top:6px">${esc2(f.message)}</p></article>`).join(''):'<p>No heuristic flags were raised; still verify the manuscript manually.</p>'}<p class="note" style="margin-top:12px">${esc2(r.limitations)}</p></div>`;save();}catch(err){$('#server-integrity-report').innerHTML=`<div class="card pad">${esc2(err.message)}</div>`;}finally{b.disabled=false;b.textContent='Run integrity check';}}
    async function rectify(){const b=$('#server-rectify');b.disabled=true;try{const d=await $api('/integrity/rectify',{method:'POST',body:json({manuscript:ta.value})});ta.value=d.revised_text;S.manuscript=ta.value;wc();save();$('#server-integrity-report').innerHTML=`<div class="card pad"><h3 class="h3d">Safe cleanup applied</h3><p style="margin-top:8px">${esc2(d.note)}</p><ul>${d.suggestions.map(s=>`<li>${esc2(s)}</li>`).join('')}</ul><p class="note">Click Revalidate to run the checks again on the corrected text.</p></div>`;}catch(err){$('#server-integrity-report').innerHTML=`<div class="card pad">${esc2(err.message)}</div>`;}finally{b.disabled=false;}}
    $('#server-check').addEventListener('click',check);$('#server-recheck').addEventListener('click',check);$('#server-rectify').addEventListener('click',rectify);
  };

  // Publication venues are loaded from the backend rather than relying only on a static list.
  const oldPublish=PAGES.publish;
  PAGES.publish=function(el){
    el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Publish</span><h1>Explore venues and prepare a submission.</h1><p class="muted">Venue details are starting points. Confirm scope, indexing, fees and current author requirements on the official site.</p></div></div><div id="server-venues" class="venues"><div class="card pad muted">Loading publication venues…</div></div>`;
    $api('/publication/venues').then(d=>{$('#server-venues').innerHTML=(d.venues||[]).map(v=>`<article class="card pad" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3 class="h3d">${esc2(v.name)}</h3><span class="pill">${esc2(v.type)}</span></div><a class="btn sm" href="${esc2(v.url)}" target="_blank" rel="noopener">Official website ↗</a></div><p style="margin-top:10px">${esc2(v.fit)}</p></article>`).join('')+`<p class="note">${esc2(d.note||'')}</p>`;}).catch(e=>$('#server-venues').innerHTML=`<div class="card pad">Could not load venues: ${esc2(e.message)}</div>`);
  };

  // Dashboard shows the signed-in user's saved server-backed workspace state.
  PAGES.dashboard=function(el){
    const runs=S.serverExperiments||[],papers=S.serverPapers||[],chat=S.serverChat||[];
    el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Workspace</span><h1>Welcome back, ${esc2(USER.name.split(' ')[0])}.</h1><p class="muted">Your IRIS workspace is connected to the backend. Continue from any stage of your research workflow.</p></div></div><div class="metrics">${[['Saved papers',papers.length],['Server experiments',runs.length],['Copilot messages',chat.length],['Manuscript words',(S.manuscript.match(/\b[\w'-]+\b/g)||[]).length]].map(([n,v])=>`<div class="card metric"><span class="l">${n}</span><div class="v">${v}</div></div>`).join('')}</div><div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px">${[['discover','Find research papers','Search scholarly records and save papers to your workspace.'],['copilot','Ask Research Copilot','Explore methods, limitations, and next steps.'],['experiments','Run an experiment','Train a model and save metrics to your account.'],['integrity','Validate manuscript','Check citations and readability, apply safe fixes, and revalidate.'],['publish','Prepare publication','Review potential venues and official submission pages.']].map(([r,t,d])=>`<button class="card pad" data-go="${r}" style="text-align:left;cursor:pointer"><h3 class="h3d">${t} ↗</h3><p class="muted" style="margin-top:8px">${d}</p></button>`).join('')}</div><section class="card pad" style="margin-top:18px"><h3 class="h3d">Recent activity</h3>${S.activity.length?`<ul style="margin-top:10px">${S.activity.slice(0,8).map(a=>`<li>${esc2(a.text)}</li>`).join('')}</ul>`:'<p class="muted">Your activity will appear here as you use IRIS.</p>'}</section>`;
  };

  // Update initial workspace and render using the replacement modules.
  (async()=>{
    try{
      if(USER){
        try{const me=await $api('/auth/me');USER={...USER,...me.user};await ensureProject();}
        catch(e){USER=null;S=null;setSession(null);if(APP_ROUTES.includes(cur))cur='auth';}
      }
      if(cur==='auth')render(); else if(cur!=='home')render();
    }catch(e){console.warn('IRIS startup sync:',e.message);}
    const status=document.getElementById('iris-api-status');if(status){try{await $api('/health');status.textContent='IRIS API · online';status.style.color='var(--good)';}catch(e){status.textContent='IRIS API · offline';}}
  })();
})();

</script>
</body></html>
