<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: public landing page, then an app workspace with a left rail. Quiet ink-and-teal UI; the multicolour iris mark is the one bold element. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EAF0F5; --line:#DAE2EB; --line-strong:#C3CEDB;
  --fg:#0E1A2B; --muted:#55657B; --faint:#8696AB;
  --accent:#0B7F86; --accent-ink:#FFFFFF; --accent-soft:#DCF0F1;
  --good:#1B7A45; --good-soft:#E0F3E8; --warn:#9A5608; --warn-soft:#FBEBD3; --bad:#B52A3A; --bad-soft:#FBE3E6;
  --shadow:0 1px 2px rgba(14,26,43,.05),0 8px 24px rgba(14,26,43,.06);
  --l1:#14B8A6; --l2:#0EA5C6; --l3:#2F80ED; --l4:#4F6BE0; --l5:#7A5AE0; --l6:#36A3D9; --spark:#F2A93B;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09111E; --surface:#0F1A2B; --surface-2:#16233A; --line:#22324B; --line-strong:#314564;
  --fg:#E8EEF7; --muted:#9AABC3; --faint:#6F829D;
  --accent:#3CC4C0; --accent-ink:#06222A; --accent-soft:#11313A;
  --good:#58CB8D; --good-soft:#12301F; --warn:#EBA650; --warn-soft:#3A2A11; --bad:#F27B88; --bad-soft:#3B1920;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --l1:#2DD4BF; --l2:#22C1E3; --l3:#5B9DFA; --l4:#7A8CF0; --l5:#9C82F2; --l6:#5BBCEB; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#09111E; --surface:#0F1A2B; --surface-2:#16233A; --line:#22324B; --line-strong:#314564;
  --fg:#E8EEF7; --muted:#9AABC3; --faint:#6F829D;
  --accent:#3CC4C0; --accent-ink:#06222A; --accent-soft:#11313A;
  --good:#58CB8D; --good-soft:#12301F; --warn:#EBA650; --warn-soft:#3A2A11; --bad:#F27B88; --bad-soft:#3B1920;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --l1:#2DD4BF; --l2:#22C1E3; --l3:#5B9DFA; --l4:#7A8CF0; --l5:#9C82F2; --l6:#5BBCEB; color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:20px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.mono{font-family:var(--font-mono);font-size:.86em}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.ic{flex:none;vertical-align:-3px}

/* buttons, pills, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font:500 12px var(--font-body);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font:inherit}
textarea{resize:vertical}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:20px}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* brand */
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand-name{font:400 26px/1 var(--font-display);letter-spacing:.14em}
.logo{display:block;color:var(--fg)}

/* landing */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-head .bar{display:flex;align-items:center;gap:20px;min-height:64px}
.site-nav{display:flex;gap:4px;margin-left:12px;flex:1}
.site-nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.site-nav button:hover{color:var(--fg);background:var(--surface-2)}
.bar-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.bar-actions .btn{white-space:nowrap}
.hero{padding-block:72px 56px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:56px;align-items:center}
.hero h1{font:400 clamp(42px,6.4vw,76px)/1.0 var(--font-display);letter-spacing:-.02em;margin:14px 0 20px}
.hero h1 em{color:var(--accent)}
.hero .lead{font-size:18px;color:var(--muted);max-width:56ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.hero .tag{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.demo{padding:20px;box-shadow:var(--shadow)}
.demo-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.demo-scores{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:16px}
.demo-scores .arrow{color:var(--faint)}
.demo-score{display:grid;justify-items:center;gap:4px;font-size:13px;color:var(--muted)}
.demo-lines{display:grid;gap:8px}
.demo-line{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:9px 11px;border-radius:8px;background:var(--surface-2)}
.demo-line .pill{margin-top:1px}
section.block{padding-block:64px}
section.block.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{max-width:62ch;margin-bottom:36px;display:grid;gap:10px}
.sec-head h2{font:400 clamp(30px,4vw,44px)/1.05 var(--font-display);letter-spacing:-.01em}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.phase{padding:20px}
.phase h3{font:500 13px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.phase ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.phase li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.phase .n{font:500 12px var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 0;text-align:center}
.phase li b{font-weight:600;display:block}
.phase li span{color:var(--muted);font-size:13.5px}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.feature{padding:24px;display:grid;gap:10px;align-content:start}
.feature .icbox{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.feature h3{font:400 26px/1.1 var(--font-display)}
.feature p{color:var(--muted)}
.feature .btn{justify-self:start;margin-top:6px}
.dra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dra .step{padding:20px;display:grid;gap:8px}
.dra .step h3{font:400 26px/1 var(--font-display)}
.dra .step .k{font:500 12px var(--font-mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.dra p{color:var(--muted);font-size:14px}
.cta-band{padding:44px;text-align:left;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font:400 clamp(28px,3.6vw,40px)/1.05 var(--font-display);max-width:22ch}
footer.site-foot{padding-block:32px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
footer .row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* app shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px;overflow:auto}
.rail .brand{padding:2px 8px}
.nav{display:grid;gap:2px}
.nav h6{margin:12px 10px 6px;font:500 11px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.rail-foot{margin-top:auto;display:grid;gap:10px;font-size:12.5px;color:var(--muted)}
.rail-proj{padding:11px 12px;border-radius:10px;background:var(--surface-2)}
.rail-proj b{display:block;color:var(--fg);font-weight:600;font-size:13px}
.main{min-width:0;padding:28px 32px 64px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{font:400 clamp(28px,3.4vw,40px)/1.05 var(--font-display);letter-spacing:-.01em;max-width:30ch}
.page-head p{margin-top:8px;max-width:64ch}
.topline{display:flex;justify-content:flex-end;margin-bottom:6px}

/* dashboard */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stage{padding:14px;text-align:left;display:grid;gap:6px;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);align-content:start}
.stage:hover{border-color:var(--accent)}
.stage .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stage .num{font:500 12px var(--font-mono);color:var(--faint)}
.stage b{font-weight:600}
.stage span.d{font-size:13px;color:var(--muted)}
.stage.current{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.done .num{color:var(--good)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:16px}
.stat .v{font:400 34px/1 var(--font-display);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.activity{list-style:none;margin:0;padding:0;display:grid}
.activity li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.activity li:last-child{border-bottom:0}
.activity time{font:12px var(--font-mono);color:var(--faint);padding-top:2px}

/* discover */
.disc{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.searchbar .grow{flex:1;min-width:220px;position:relative}
.searchbar .grow .ic{position:absolute;left:12px;top:11px;color:var(--faint)}
.searchbar input{padding-left:38px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.papers{display:grid;gap:12px}
.paper{padding:18px;display:grid;gap:10px}
.paper h3{font:400 23px/1.15 var(--font-display)}
.paper .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paper .sum{font-size:14.5px}
.paper .tags{display:flex;gap:6px;flex-wrap:wrap}
.paper .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.paper .links{display:flex;gap:8px;flex-wrap:wrap}
.paper .links a{display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:500;text-decoration:none;padding:4px 9px;border-radius:7px;background:var(--surface-2)}
.paper .links a:hover{background:var(--accent-soft)}
.rel{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:90px}
.rel i{display:block;height:100%;background:var(--accent)}
.lib{padding:16px;position:sticky;top:20px}
.lib h3{font:400 22px var(--font-display);margin-bottom:10px}
.lib ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.lib li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;font-size:13.5px}
.lib li small{display:block;color:var(--muted)}
.note{font-size:13px;color:var(--muted);padding:11px 13px;border-radius:9px;background:var(--surface-2)}

/* copilot */
.cop{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.ctx{padding:16px;position:sticky;top:20px;display:grid;gap:12px}
.ctx h3{font:400 22px var(--font-display)}
.ctx label{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;font-size:13.5px;cursor:pointer}
.ctx label small{display:block;color:var(--muted)}
.ctx input[type=checkbox],.checklist input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
.chatbox{display:grid;grid-template-rows:1fr auto;min-height:560px;max-height:calc(100vh - 150px)}
.msgs{overflow:auto;padding:20px;display:grid;gap:18px;align-content:start}
.msg{display:grid;gap:8px;max-width:88%}
.msg.user{justify-self:end}
.msg.user .bub{background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 3px 14px;padding:10px 14px}
.msg.ai{grid-template-columns:30px minmax(0,1fr);column-gap:10px;max-width:100%}
.msg.ai .bub{min-width:0}
.bub p+p,.bub p+ul,.bub ul+p,.bub p+.tscroll{margin-top:8px}
.bub ul{margin:0;padding-left:18px;display:grid;gap:6px}
.bub h4{font:600 14px var(--font-body);margin:10px 0 4px}
.cm{font:500 11px var(--font-mono);color:var(--accent);vertical-align:super;margin-left:1px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}
.srcs a{text-decoration:none;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.srcs a:hover{color:var(--accent)}
.tscroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font:500 12px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.gap{padding:12px 14px;border:1px solid var(--line);border-radius:10px;display:grid;gap:8px;margin-top:8px;background:var(--bg)}
.composer{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.composer .qp{display:flex;gap:8px;flex-wrap:wrap}
.composer .in{display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* experiments */
.exp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.ctrl{padding:18px;display:grid;gap:14px;position:sticky;top:20px}
.ctrl h3{font:400 22px var(--font-display)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.metric{padding:14px}
.metric .v{font:400 30px/1 var(--font-display);font-variant-numeric:tabular-nums;margin-top:6px}
.metric .l{font-size:12.5px;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.cm-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:stretch;font-size:13px}
.cm-grid .h{color:var(--muted);font:500 11px var(--font-mono);display:grid;place-items:center;padding:2px 6px;text-align:center}
.cm-cell{padding:16px 8px;border-radius:8px;text-align:center;font:400 28px/1 var(--font-display);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.cm-cell small{display:block;font:11px var(--font-body);color:var(--muted);margin-top:4px}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar-row .trk{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar-row .trk i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar-row.alt .trk i{background:var(--l4)}
.bar-row .v{font:12px var(--font-mono);text-align:right}
.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--muted);font:10.5px var(--font-mono)}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ln{stroke:var(--accent);fill:none;stroke-width:2;stroke-linejoin:round}
.ch .ar{fill:var(--accent-soft)}
.ch .dot{fill:var(--accent)}
tr.sel td{background:var(--accent-soft)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}

/* integrity */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.editor{padding:16px;display:grid;gap:10px;position:sticky;top:20px}
.editor textarea{min-height:520px;font:14.5px/1.65 var(--font-body)}
.editor .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.pipe button{display:grid;gap:3px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.pipe button:hover:not([disabled]){border-color:var(--accent)}
.pipe button[disabled]{opacity:.55;cursor:not-allowed}
.pipe .k{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pipe b{font:400 21px var(--font-display)}
.pipe small{color:var(--muted);font-size:12.5px}
.pipe button.on{border-color:var(--accent);background:var(--accent-soft)}
.pipe button.on .k{color:var(--accent)}
.score{padding:18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:16px}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:400 34px var(--font-display);font-variant-numeric:tabular-nums}
.comp{display:grid;gap:7px}
.comp .r{display:grid;grid-template-columns:128px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.comp .trk{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.comp .trk i{display:block;height:100%;border-radius:4px}
.comp .v{font:12px var(--font-mono);text-align:right}
.banner{padding:10px 13px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;margin-bottom:14px}
.finds{display:grid;gap:10px}
.finding{padding:14px 16px;display:grid;gap:7px}
.finding header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.finding .cat{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.finding h4{font:600 14.5px var(--font-body)}
.finding p{font-size:13.5px;color:var(--muted)}
.finding blockquote{margin:0;padding:8px 11px;border-left:3px solid var(--line-strong);background:var(--surface-2);font-size:13px;border-radius:0 6px 6px 0}
.finding .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.cmp{width:100%}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* publish */
.pub{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.venues{display:grid;gap:10px}
.venue{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:8px;cursor:pointer;text-align:left}
.venue:hover{border-color:var(--accent)}
.venue.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.venue .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.venue b{font-weight:600}
.venue .fit{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font:12px var(--font-mono);color:var(--muted)}
.venue .trk{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.venue .trk i{display:block;height:100%;background:var(--accent)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checklist li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.checklist li:last-child{border-bottom:0}
.checklist .auto{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:2px}
.checklist .auto.ok{background:var(--good-soft);color:var(--good)}
.checklist .auto.no{background:var(--bad-soft);color:var(--bad)}
.checklist small{display:block;color:var(--muted);font-size:12.5px}
.docs{display:grid;gap:10px}
.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.doc small{display:block;color:var(--muted)}
.section-gap{display:grid;gap:16px}
.h3d{font:400 24px/1.1 var(--font-display);margin-bottom:10px}

/* auth + profile */
.auth{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:100vh}
.auth-side{background:var(--surface-2);border-right:1px solid var(--line);padding:32px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-side h2{font:400 clamp(30px,3.4vw,44px)/1.05 var(--font-display);letter-spacing:-.01em;max-width:16ch;margin-bottom:18px}
.auth-side ul{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:42ch;color:var(--muted)}
.auth-side li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.auth-side li .ic{color:var(--accent);margin-top:2px}
.auth-main{padding:20px 32px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.auth-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.auth-card{width:100%;max-width:440px;margin:auto;padding:28px;box-shadow:var(--shadow);display:grid;gap:16px}
.auth-card h1{font:400 32px/1.05 var(--font-display)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:10px;background:var(--surface-2)}
.tabs button{border:0;background:none;padding:8px;border-radius:7px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(14,26,43,.1)}
.err{padding:9px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13.5px}
.demo-note{padding:11px 13px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.codechip{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:7px;background:var(--surface);font:500 18px var(--font-mono);letter-spacing:.2em;color:var(--fg)}
.otp{font:500 26px var(--font-mono)!important;letter-spacing:.5em;text-align:center}
.rail-user{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.rail-user .who{min-width:0}
.rail-user b,.rail-user small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-user b{color:var(--fg);font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--font-body)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:20px;align-items:start}
.prof-head{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.form-grid{display:grid;gap:14px}
.danger{border-color:var(--bad)}
@media (max-width:900px){.auth{grid-template-columns:minmax(0,1fr)}.auth-side{padding:20px 16px;border-right:0;border-bottom:1px solid var(--line)}.auth-side ul,.auth-side h2{display:none}.auth-main{padding:16px}.prof{grid-template-columns:minmax(0,1fr)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1060px){
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .split,.pub,.res-grid{grid-template-columns:minmax(0,1fr)}
  .editor,.ctrl,.ctx,.lib{position:static}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero-grid,.disc,.cop,.exp,.grid2{grid-template-columns:minmax(0,1fr)}

  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);gap:10px}
  .rail .nav{display:flex;gap:4px;overflow-x:auto;width:100%;order:3;padding-bottom:2px}
  .nav h6{display:none}
  .nav button{white-space:nowrap;width:auto}
  .rail-foot{display:none}
  .main{padding:20px 16px 56px}
  .hero{padding-block:40px 32px}
  .chatbox{max-height:none}
  .site-nav{display:none}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cta-band{padding:28px}
}
@media (max-width:520px){
  .stages{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:minmax(0,1fr)}
  .score{grid-template-columns:minmax(0,1fr);justify-items:start}
  .pipe{grid-template-columns:minmax(0,1fr)}
  .comp .r{grid-template-columns:100px 1fr 30px}
  .bar-row{grid-template-columns:100px 1fr 46px}
  .demo-scores{grid-template-columns:1fr}
  .demo-scores .arrow{display:none}
  .msg{max-width:100%}
  .bar-actions .btn.primary{padding:8px 11px;font-size:13px}
  .site-head .bar{gap:10px}
  .brand-name{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

    const B=/(\d{1,3}(?:\.\d+)?)(\s*%)?\s+(accuracy|precision|recall|f1(?:[-\s]score)?|f-measure)\b/gi;

function parseCites(text){

    const inner=g.slice(1,-1).split(';');
    for(const part of inner){
      const m=part.trim().match(/^([A-Z][A-Za-z\-]+)(?:\s+et al\.?|\s+(?:and|&)\s+[A-Z][A-Za-z\-]+)?,?\s+(\d{4})[a-z]?$/);

      const fmt=c.pct?rec.toFixed(Math.max(1,c.dec))+'%':(rec/100).toFixed(Math.max(2,c.dec)),old=c.num+(c.pct?'%':'');
      findings.push({id:'cons:'+c.model+':'+c.metric+':'+c.num,cat:'Results consistency',sev:'high',title:MODELS[c.model].name+' '+METRIC_LABEL[c.metric]+' does not match the record',detail:'The draft says '+old+'. Run '+run.id+' recorded '+fmt+'.',quote:c.sentence,pen:0,
        fix:{label:'Use recorded value '+fmt,apply:t=>{const s=c.sentence;const ns=s.slice(0,c.start)+(c.pct?rec.toFixed(Math.max(1,c.dec)):(rec/100).toFixed(Math.max(2,c.dec)))+s.slice(c.end);return t.replace(s,ns);}}});
    }
  });

  /* ranking claims */
  const RANK=/(decision trees?|random forests?|logistic regression|k-?nearest neighbou?rs?|\bk-?nn\b|(?:gaussian )?naive bayes)(?:\s+classifier)?\s+(?:outperforms?|outperformed|beats?|is the best|performs? best)/i;
  sents.forEach(sent=>{
    const m=sent.match(RANK);if(!m||!/\b(other|all|every)\b/i.test(sent))return;
    let k=null;for(const kk in MODEL_ALIAS){if(new RegExp(MODEL_ALIAS[kk].source,'i').test(m[1])){k=kk;break;}}
    if(!k||!latest[k]||Object.keys(latest).length<2)return;
    const top=Object.entries(latest).sort((a,b)=>b[1].metrics.f1-a[1].metrics.f1)[0];
    if(top[0]===k)return;
    consBad++;
    const bestName=MODELS[top[0]].lc;
    findings.push({id:'rank:'+k+':'+hash(sent),cat:'Results consistency',sev:'high',title:'Ranking claim is not supported by the records',detail:'The draft says the '+MODELS[k].lc+' outperforms the other models. By F1, the records rank the '+bestName+' first ('+top[1].metrics.f1.toFixed(2)+') and the '+MODELS[k].lc+' at '+latest[k].metrics.f1.toFixed(2)+'.',quote:sent,pen:0,
      fix:{label:'Name the '+bestName+' instead',apply:t=>t.replace(sent,sent.replace(new RegExp(MODEL_ALIAS[k].source,'i'),bestName))}});
  });

  /* uncited library papers (info) */
  /* scores */
  const simPen=findings.filter(f=>f.cat==='Similarity').reduce((s,f)=>s+f.pen,0);
  const citePen=findings.filter(f=>f.cat==='Citation accuracy').reduce((s,f)=>s+f.pen,0);
  const mism=findings.filter(f=>f.cat==='Results consistency').length;
  const scores={
    orig:Math.max(0,100-simPen),
    nov:novelty,
    cite:Math.max(0,100-citePen),
    contrib:hasContrib?100:35,
    cons:claims.length?Math.max(0,100-Math.min(100,mism*30)):70
  };
  const W={orig:.25,nov:.2,cite:.2,contrib:.15,cons:.2};
  const overall=Math.round(Object.keys(W).reduce((s,k)=>s+scores[k]*W[k],0));
  findings.sort((a,b)=>sevRank[a.sev]-sevRank[b.sev]);
  const counts={high:0,medium:0,low:0};findings.forEach(f=>counts[f.sev]++);
  return{findings,scores,overall,counts,closest,maxcos,claims,cites:{total:seen.size,verified},simHits,hasContrib,diff,label:overall>=85?'Ready to prepare':overall>=65?'Needs revision':'Not ready'};
}
function fixAll(text,runs,acks){

  return [
   {n:1,name:'Discover',route:'discover',desc:'Save papers with source links',done:S.library.length>0},

/* ================= Discover ================= */
function discoverResults(){
  const q=UI.q.trim();let list;
  if(q){
    list=searchIdx(PIDX,q,16).map(x=>({p:PBY[x.d.id],score:x.score}));
    const ql=q.toLowerCase();
    PAPERS.forEach(p=>{if(!list.find(x=>x.p===p)&&(p.title+' '+p.authors+' '+p.venue).toLowerCase().includes(ql))list.push({p,score:.12});});
  }else{
    list=searchIdx(PIDX,PROJECT_TOPIC,16).map(x=>({p:PBY[x.d.id],score:x.score}));
    PAPERS.forEach(p=>{if(!list.find(x=>x.p===p))list.push({p,score:0});});
  }
  if(UI.kind!=='All')list=list.filter(x=>x.p.kind===UI.kind);
  if(UI.saved)list=list.filter(x=>S.library.includes(x.p.id));
  const mx=Math.max(.0001,...list.map(x=>x.score));
  return list.map(x=>Object.assign(x,{rel:x.score/mx}));
}

const GAP_RULES=[
 {needs:['intrusion','few-shot'],title:'Few-shot adaptation to new attack types',text:'Combine prototype-based few-shot classification with flow-based IoT detection, so a new attack family can be learned from a handful of labelled flows.'},
 {needs:['intrusion','federated'],title:'Federated training across IoT sites',text:'Train a detector across several networks with federated averaging, so sites share what they learn without sharing raw traffic.'},
 {needs:['intrusion','tree-ensemble'],title:'Tree ensembles versus autoencoder detection on the same data',text:'Compare tree ensembles with autoencoder-based detection on one labelled flow dataset, and report accuracy together with model size and inference time.'},
 {needs:['dataset','tree-ensemble'],title:'Class imbalance in flow datasets',text:'Study how class weights or resampling change recall for tree ensembles when attack flows are rare.'},
 {needs:['retrieval','intrusion'],title:'Retrieval-grounded explanations for alerts',text:'Retrieve related incident reports or papers to attach evidence to each alert for a human analyst.'}
];
const QUICK=['Compare methodologies','Extract key findings','Identify research gaps','How are my experiments doing?','Explain anomaly detection'];
function runsAnswer(ci,ctx){
  const L=Object.values(latestByModel(S.runs)).sort((a,b)=>b.metrics.f1-a.metrics.f1);
  if(!S.useRecords)return '<p>Experiment records are switched off in the context panel. Turn them on and ask again.</p>';
  if(!L.length)return '<p>No experiment runs are recorded yet. Open the Experiment Engine and run a model first.</p>';
  const b=L[0],w=L[L.length-1],m=b.metrics;
  let h=`<p>You have <b>${S.runs.length}</b> recorded runs across <b>${L.length}</b> models. Using the latest run of each model:</p><div class="tscroll"><table class="t"><thead><tr><th>Model</th><th class="num">Accuracy</th><th class="num">Precision</th><th class="num">Recall</th><th class="num">F1</th></tr></thead><tbody>${L.map(r=>`<tr><td>${MODELS[r.model].name} <span class="faint mono">${r.id}</span></td><td class="num">${pct(r.metrics.acc)}</td><td class="num">${pct(r.metrics.prec)}</td><td class="num">${pct(r.metrics.rec)}</td><td class="num">${r.metrics.f1.toFixed(3)}</td></tr>`).join('')}</tbody></table></div><ul>`;
  h+=`<li><b>${MODELS[b.model].name}</b> leads on F1 (${m.f1.toFixed(3)}); <b>${MODELS[w.model].name}</b> is last (${w.metrics.f1.toFixed(3)}).</li>`;
  if(m.rec<m.prec-.02)h+=`<li>For the leading model, recall (${pct(m.rec)}) trails precision (${pct(m.prec)}), so some attacks are being missed. Lowering the decision threshold or weighting the attack class are the usual next experiments.</li>`;
  else if(m.prec<m.rec-.02)h+=`<li>For the leading model, precision (${pct(m.prec)}) trails recall (${pct(m.rec)}), so false alarms outnumber misses. A higher threshold or more regularisation may help.</li>`;
  else h+=`<li>For the leading model, precision and recall are balanced.</li>`;
  if(L.length>1&&L[0].metrics.f1-L[1].metrics.f1<.01)h+=`<li>The top two models are within 0.01 F1, so repeat the runs with different seeds before claiming a winner.</li>`;
  if(b.model==='rf'&&ctx.includes('breiman2001'))h+=`<li>This fits the argument in ${citeOf(PBY.breiman2001)} that forests keep generalising as trees are added${ci('breiman2001')}.</li>`;
  return h+'</ul>';
}
function copAnswer(q){
  const ctx=S.context.filter(id=>PBY[id]),src=[];
  const ci=id=>{let i=src.indexOf(id);if(i<0){src.push(id);i=src.length-1;}return `<sup class="cm">[${i+1}]</sup>`;};
  const wantsRuns=/\b(my|our)\b[^?]*\b(experiment|run|result|model)s?\b|experiment record|how are my/i.test(q);
  let html='';
  if(wantsRuns)html=runsAnswer(ci,ctx);
  else if(!ctx.length)html='<p>No papers are selected as context. Choose at least one on the left, or add papers from Discover.</p>';
  else if(/compar|differ|versus|\bvs\b|methodolog/i.test(q)){
    html=`<p>Comparison of the ${ctx.length} selected papers:</p><div class="tscroll"><table class="t"><thead><tr><th>Paper</th><th>Method</th><th>Data</th><th>Key result</th><th>Limitation</th></tr></thead><tbody>${ctx.map(id=>{const p=PBY[id];return `<tr><td><b>${esc(p.authors)}</b> ${p.year}${ci(id)}</td><td>${esc(p.method)}</td><td>${esc(p.data)}</td><td>${esc(p.findings[0])}</td><td>${esc(p.limits[0])}</td></tr>`;}).join('')}</tbody></table></div>`;
  }else if(/gap|limitation|future work|direction|idea|opportunit|novel/i.test(q)){
    S.gapsRun=true;
    const by={};ctx.forEach(id=>PBY[id].tags.forEach(t=>{if(!by[t])by[t]=id;}));
    const rules=GAP_RULES.filter(r=>r.needs.every(t=>by[t]));
    html=`<h4>Limitations reported in the selected papers</h4><ul>${ctx.slice(0,6).map(id=>`<li>${esc(PBY[id].limits[0])} <span class="faint">${esc(citeOf(PBY[id]))}</span>${ci(id)}</li>`).join('')}</ul>`;
    html+=rules.length?`<h4>Candidate research directions</h4>`+rules.map(r=>{const ids=[...new Set(r.needs.map(t=>by[t]))];return `<div class="gap"><b>${esc(r.title)}</b><span>${esc(r.text)} ${ids.map(ci).join('')}</span><div><button class="btn sm ${S.direction===r.title?'':'primary'}" data-adopt="${esc(r.title)}">${S.direction===r.title?'Adopted':'Adopt as my direction'}</button></div></div>`;}).join('')+`<p class="faint" style="margin-top:10px;font-size:13px">These are suggestions drawn from the selected papers. Check each one against a wider literature search before committing to it.</p>`:`<p>The selected papers do not combine into an obvious new direction. Add papers from a second area, such as few-shot learning or federated training, and ask again.</p>`;
  }else if(/finding|result|extract|summar|key point|contribution/i.test(q)){
    html=`<p>Key findings from the ${ctx.length} selected papers:</p><ul>${ctx.map(id=>{const p=PBY[id];return `<li><b>${esc(p.authors)} (${p.year})</b>${ci(id)}: ${esc(p.findings.join(' '))}</li>`;}).join('')}</ul>`;
  }else{
    const g=GLOSSARY.find(x=>x.re.test(q));
    const hits=searchIdx(CIDX,q,40).filter(x=>ctx.includes(x.d.pid)&&x.score>.04).slice(0,3);
    if(g&&/explain|what is|what are|define|meaning|how does|how do|tell me about/i.test(q)){
      html=`<h4>${esc(g.name)}</h4><p>${esc(g.text)}</p>`;
      if(hits.length)html+=`<p style="margin-top:10px">In your papers:</p><ul>${hits.map(h=>`<li>${esc(h.d.raw)} <span class="faint">${esc(citeOf(PBY[h.d.pid]))}</span>${ci(h.d.pid)}</li>`).join('')}</ul>`;
    }else if(hits.length){
      html=`<p>The most relevant passages in your selected papers:</p><ul>${hits.map(h=>`<li>${esc(h.d.raw)} <span class="faint">${esc(citeOf(PBY[h.d.pid]))}</span>${ci(h.d.pid)}</li>`).join('')}</ul><p class="faint" style="font-size:13px">These are retrieved passages, not a synthesised answer. Try “compare”, “gaps” or “findings” for a structured view.</p>`;
    }else html='<p>I could not find passages that match that question in the selected papers. Try different terms, select more papers, or add papers from Discover.</p>';
  }
  return{html,sources:src};
}

/* ================= Experiments ================= */
function paramText(r){
  const p=r.params;
  if(r.model==='lr')return p.epochs+' epochs, rate '+p.lr;
  if(r.model==='knn')return 'k = '+p.k;
  if(r.model==='nb')return 'no parameters';
  if(r.model==='dt')return 'depth '+p.maxDepth;
  return p.trees+' trees, depth '+p.maxDepth;
}
function paramInputs(){
  const p=UI.params,m=UI.model;
  const num=(id,label,min,max,step)=>`<label class="f">${label}<input type="number" id="p-${id}" min="${min}" max="${max}" step="${step||1}" value="${p[id]}"></label>`;
  if(m==='lr')return num('epochs','Epochs',10,500)+num('lr','Learning rate',.001,1,.01);
  if(m==='knn')return num('k','Neighbours (k)',1,51);
  if(m==='dt')return num('maxDepth','Maximum depth',1,14);
  if(m==='rf')return num('trees','Trees',1,100)+num('maxDepth','Maximum depth',1,14);
  return '<p class="note">Gaussian naive Bayes has no tunable parameters here.</p>';
}
function lossChart(v){
  const W=330,H=150,l=38,b=22,t=8,r=8,mx=Math.max(...v),mn=Math.min(...v),rg=(mx-mn)||1;
  const X=i=>l+(W-l-r)*i/Math.max(1,v.length-1),Y=x=>t+(H-t-b)*(1-(x-mn)/rg);
  const pts=v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1));
  const ticks=[mn,(mn+mx)/2,mx];
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Training loss per epoch, from ${mx.toFixed(2)} down to ${mn.toFixed(2)}">${ticks.map(x=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${Y(x).toFixed(1)}" y2="${Y(x).toFixed(1)}"/><text x="${l-6}" y="${(Y(x)+3.5).toFixed(1)}" text-anchor="end">${x.toFixed(2)}</text>`).join('')}
  <path class="ar" d="M${X(0).toFixed(1)},${H-b} L${pts.join(' L')} L${X(v.length-1).toFixed(1)},${H-b} Z"/><polyline class="ln" points="${pts.join(' ')}"/><circle class="dot" cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="3.5"/>
  <text x="${l}" y="${H-5}">1</text><text x="${W-r}" y="${H-5}" text-anchor="end">${v.length} epochs</text></svg>`;
}
function resultHTML(r){
  const m=r.metrics,c=r.cm,mx=Math.max(c.tp,c.fp,c.tn,c.fn,1);
  const cell=(n,lab,good)=>`<div class="cm-cell" style="background:color-mix(in srgb,${good?'var(--accent)':'var(--bad)'} ${Math.round(8+40*n/mx)}%,var(--surface))">${n}<small>${lab}</small></div>`;
  const chart=r.loss.length?`<h3 class="h3d">Training loss</h3>${lossChart(r.loss)}`:r.importance?`<h3 class="h3d">${r.model==='lr'?'Weight share':'Feature importance'}</h3><div class="bars">${r.importance.slice().sort((a,b)=>b.value-a.value).map(f=>`<div class="bar-row"><span>${f.name}</span><span class="trk"><i style="width:${Math.round(f.value*100)}%"></i></span><span class="v">${(f.value*100).toFixed(0)}%</span></div>`).join('')}</div>`:`<h3 class="h3d">Notes</h3><p class="muted">${MODELS[r.model].name} has no loss curve or feature weights to display. Its metrics are on the test split only.</p>`;
  return `<div class="card pad" style="margin-bottom:16px"><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center"><div><b style="font-size:17px">${MODELS[r.model].name}</b> <span class="pill accent">${r.id}</span><div class="muted" style="font-size:13px;margin-top:3px">${paramText(r)} · seed ${r.seed} · ${r.nTrain} train / ${r.nTest} test · ${stamp(r.ts)}</div></div><span class="mono faint" title="Fingerprint of settings and metrics">record ${r.rec}</span></div></div>
  <div class="metrics" style="margin-bottom:16px">${[['Accuracy',m.acc],['Precision',m.prec],['Recall',m.rec],['F1 score',m.f1]].map(([l,v])=>`<div class="card metric"><span class="l">${l}</span><div class="v">${pct(v)}</div></div>`).join('')}</div>
  <div class="res-grid"><div class="card pad"><h3 class="h3d">Confusion matrix</h3><div class="cm-grid"><span></span><span class="h">Predicted benign</span><span class="h">Predicted attack</span><span class="h">Actual benign</span>${cell(c.tn,'true negatives',true)}${cell(c.fp,'false alarms',false)}<span class="h">Actual attack</span>${cell(c.fn,'missed attacks',false)}${cell(c.tp,'detected',true)}</div></div><div class="card pad">${chart}</div></div>`;
}
function compareHTML(){

function logHTML(){

}

const GMAIL=/^[a-z0-9._%+-]+@(gmail|googlemail)\.com$/i;
const initials=n=>((n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();
const MEM={acc:{},sess:null};
function accounts(){try{return JSON.parse(localStorage.getItem('iris-accounts')||'{}');}catch(e){return MEM.acc;}}
function saveAccounts(a){MEM.acc=a;try{localStorage.setItem('iris-accounts',JSON.stringify(a));}catch(e){}}
function getSession(){try{return localStorage.getItem('iris-session');}catch(e){return MEM.sess;}}
function setSession(email){MEM.sess=email;try{if(email)localStorage.setItem('iris-session',email);else localStorage.removeItem('iris-session');}catch(e){}}
function restoreSession(){
  const em=getSession(),a=em&&accounts()[em];
  if(a){USER=a;S=loadState();}
}
function signOut(){
  clearTimeout(_st);try{localStorage.setItem(stateKey(),JSON.stringify(S));}catch(e){}
  setSession(null);USER=null;S=null;UI.sel=null;UI.draft={};UI.venueView=null;
  AUTH.step='form';AUTH.mode='signin';AUTH.err='';

}
function newCode(){
  AUTH.code=String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
  AUTH.exp=Date.now()+5*60000;AUTH.tries=0;AUTH.resendAt=Date.now()+30000;
}
function authForm(){

  <div class="demo-note"><b>Demo mode.</b> This prototype has no mail server or Google connection, so the code is shown here instead of being emailed. The full build sends it to the Gmail address from the backend.<br><span class="codechip" aria-label="Demo verification code">${AUTH.code}</span></div>

}
function authPage(){
  return `<div class="auth"><aside class="auth-side"><a class="brand" href="#home" data-go="home" aria-label="IRIS home">${logo(34)}<span class="brand-name">IRIS</span></a>

  <div class="card auth-card">${AUTH.step==='otp'?authOtp():authForm()}</div></main></div>`;

function bindAuth(){
  const root=$('.auth-card');
  clearInterval(AUTH.timer);
  if(AUTH.step==='otp'){
    const rb=$('#resend'),tick=()=>{
      const b=$('#resend');if(!b){clearInterval(AUTH.timer);return;}
      const s=Math.ceil((AUTH.resendAt-Date.now())/1000);
      if(s>0){b.disabled=true;b.textContent='Resend code in '+s+'s';}else{b.disabled=false;b.textContent='Resend code';}
    };
    tick();AUTH.timer=setInterval(tick,1000);
    const o=$('#otp');if(o)o.focus();
  }
  root.addEventListener('click',e=>{
    const m=e.target.closest('[data-mode]');
    if(m){e.preventDefault();AUTH.name=($('#a-name')||{}).value||AUTH.name;AUTH.email=($('#a-email')||{}).value||AUTH.email;AUTH.mode=m.dataset.mode;AUTH.err='';render();return;}
    if(e.target.closest('[data-back]')){AUTH.step='form';AUTH.err='';AUTH.code=null;render();return;}
    if(e.target.closest('#resend')){const b=$('#resend');if(b&&!b.disabled){newCode();AUTH.err='';render();toast('A new code was generated');}}
  });
  const f=$('#authForm');
  if(f)f.addEventListener('submit',e=>{
    e.preventDefault();
    const email=$('#a-email').value.trim().toLowerCase(),name=($('#a-name')||{value:''}).value.trim();
    AUTH.email=email;AUTH.name=name;
    const acc=accounts();let err='';
    if(!GMAIL.test(email))err='Enter a Gmail address, for example name@gmail.com.';
    else if(AUTH.mode==='signup'&&!name)err='Enter your full name.';
    else if(AUTH.mode==='signup'&&acc[email])err='An account already exists for this address. Use Sign in instead.';
    else if(AUTH.mode==='signin'&&!acc[email])err='No account found for this address. Use Sign up to create one.';
    if(err){AUTH.err=err;render();return;}
    AUTH.err='';newCode();AUTH.step='otp';render();
  });
  const of=$('#otpForm');
  if(of)of.addEventListener('submit',e=>{
    e.preventDefault();
    const v=$('#otp').value.trim();
    if(Date.now()>AUTH.exp){AUTH.err='This code has expired. Request a new one.';render();return;}
    if(AUTH.tries>=5){AUTH.err='Too many wrong attempts. Request a new code.';render();return;}
    if(!/^\d{6}$/.test(v)){AUTH.err='Enter all 6 digits.';render();return;}
    if(v!==AUTH.code){AUTH.tries++;AUTH.err=AUTH.tries>=5?'Too many wrong attempts. Request a new code.':'That code is not correct.';render();return;}
    const acc=accounts();
    if(AUTH.mode==='signup'&&!acc[AUTH.email]){acc[AUTH.email]={email:AUTH.email,name:AUTH.name,org:'',created:Date.now()};saveAccounts(acc);}
    USER=acc[AUTH.email];setSession(USER.email);S=loadState();
    if(!S.activity.length||S.activity[0].text.indexOf('Signed in')<0)log(S,'Signed in as '+USER.email);
    const to=AUTH.pending||'dashboard';
    AUTH.step='form';AUTH.code=null;AUTH.pending=null;AUTH.err='';clearInterval(AUTH.timer);save();
    go(to);toast('Email verified. Welcome, '+USER.name.split(' ')[0]+'.');
  });
}

/* ================= Integrity & Novelty ================= */
const COMPS=[['orig','Originality'],['nov','Novelty'],['cite','Citation accuracy'],['contrib','Research contribution'],['cons','Results consistency']];
function compBars(sc){return `<div class="comp">${COMPS.map(([k,l])=>`<div class="r"><span>${l}</span><span class="trk"><i style="width:${sc[k]}%;background:${scoreColor(sc[k])}"></i></span><span class="v">${sc[k]}</span></div>`).join('')}</div>`;}
function findingHTML(f){
  return `<article class="card finding"><header>${sevPill(f.sev)}<span class="cat">${f.cat}</span></header><h4>${esc(f.title)}</h4><p>${esc(f.detail)}</p>${f.quote?`<blockquote>${esc(f.quote)}</blockquote>`:''}
  <div class="acts">${f.fix?`<button class="btn sm primary" data-act="fix" data-id="${esc(f.id)}">${icon('check',14)} ${esc(f.fix.label)}</button>`:''}${f.ack?`<button class="btn sm" data-act="ack" data-id="${esc(f.id)}">${esc(f.ack)}</button>`:''}${f.go?`<button class="btn sm" data-go="${f.go}">Open Experiment Engine</button>`:''}${!f.fix&&!f.ack&&!f.go?'<span class="faint" style="font-size:13px">Needs your judgement. Edit the draft, then revalidate.</span>':''}</div></article>`;
}
function integPanel(){
  const a=live(),st=S.integ.stage,snap=S.integ.snap,base=S.integ.baseline,stale=snap&&snap.hash!==curHash();
  const auto=a.findings.filter(f=>f.fix).length;
  let h=`<div class="pipe">
   <button data-act="detect" class="${st==='detected'?'on':''}"><span class="k">Step 1</span><b>Detect</b><small>${st==='idle'?'Analyse the draft':'Run again as a new baseline'}</small></button>
   <button data-act="rectify" ${st==='idle'?'disabled':''} class="${st==='rectified'?'on':''}"><span class="k">Step 2</span><b>Rectify</b><small>${st==='idle'?'Detect first':auto?'Apply '+auto+' fix'+(auto===1?'':'es'):'No automatic fixes left'}</small></button>
   <button data-act="revalidate" ${st==='idle'?'disabled':''} class="${st==='revalidated'?'on':''}"><span class="k">Step 3</span><b>Revalidate</b><small>Confirm the new score</small></button></div>`;
  if(!snap)return h+`<div class="card pad"><h3 class="h3d">Ready to check</h3><p class="muted">Run <b>Detect</b> to compare this draft with the paper library and your experiment records. It checks similarity, novelty, citations, the contribution statement and every reported result.</p></div>`;
  if(stale)h+=`<div class="banner">The draft has changed since the last validation. Revalidate to refresh the score.</div>`;
  const delta=base&&st==='revalidated'&&base.hash!==snap.hash?snap.overall-base.overall:null;
  h+=`<div class="card score">${ring(snap.overall)}<div><b style="font-size:17px">${snap.label}</b><div class="muted" style="font-size:13.5px;margin:2px 0 10px">${delta!==null?`Baseline ${base.overall}, now ${snap.overall} (<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}</span>)`:'Readiness for submission, 0 to 100'}</div>${compBars(snap.scores)}</div></div>`;
  if(a.closest)h+=`<p class="note" style="margin-bottom:14px">Closest prior work in the library: <b>${esc(citeOf(a.closest))}</b>, ${esc(a.closest.title)} (text similarity ${a.maxcos.toFixed(2)}).</p>`;
  if(st==='revalidated'&&delta!==null){
    h+=`<div class="card pad" style="margin-bottom:14px"><h3 class="h3d">Before and after</h3><div class="tscroll"><table class="t cmp"><thead><tr><th>Check</th><th class="num">Detected</th><th class="num">Now</th><th class="num">Change</th></tr></thead><tbody>${COMPS.map(([k,l])=>{const d=snap.scores[k]-base.scores[k];return `<tr><td>${l}</td><td class="num">${base.scores[k]}</td><td class="num">${snap.scores[k]}</td><td class="num delta ${d>0?'up':d<0?'down':''}">${d>0?'+':''}${d}</td></tr>`;}).join('')}<tr><td><b>Overall</b></td><td class="num">${base.overall}</td><td class="num">${snap.overall}</td><td class="num delta ${delta>=0?'up':'down'}"><b>${delta>=0?'+':''}${delta}</b></td></tr></tbody></table></div></div>`;
  }
  const c=a.counts;
  h+=`<h3 class="h3d">${a.findings.length?a.findings.length+' open finding'+(a.findings.length===1?'':'s'):'No open findings'}</h3>`;
  if(a.findings.length)h+=`<p class="muted" style="font-size:13.5px;margin:-4px 0 12px">${c.high} high, ${c.medium} medium, ${c.low} low. Findings reflect the current text; the score above reflects the last validation.</p><div class="finds">${a.findings.map(findingHTML).join('')}</div>`;
  else h+=`<div class="card pad muted">Nothing is flagged in the current text. Revalidate to confirm.</div>`;
  return h;
}
PAGES.integrity=function(el){
  el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Research Integrity &amp; Novelty Engine</span><h1>Detect, rectify, revalidate.</h1><p class="muted">The draft is checked against the paper library and your experiment records. Fixes change the text only when you click them, and you can undo anything by editing.</p></div></div>
  <div class="split"><section class="card editor"><div class="bar"><b>Manuscript draft</b><span id="wc"></span></div><textarea id="ms" spellcheck="true" aria-label="Manuscript draft"></textarea><p class="note">This sample draft contains deliberate problems. Edit it or paste your own. Citations are read in (Author, Year) form.</p></section><section id="panel" style="min-width:0"></section></div>`;
  const ta=$('#ms'),panel=$('#panel'),wcEl=$('#wc');
  ta.value=S.manuscript;
  const upd=()=>{wcEl.textContent=wc(S.manuscript).toLocaleString('en-US')+' words';};
  const draw=()=>{panel.innerHTML=integPanel();};
  upd();draw();
  let t;ta.addEventListener('input',()=>{S.manuscript=ta.value;upd();save();clearTimeout(t);t=setTimeout(()=>{if(cur==='integrity')draw();},300);});
  panel.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    const act=b.dataset.act,id=b.dataset.id;
    if(act==='detect'){const s=snapshotOf(live());S.integ.baseline=s;S.integ.snap=s;S.integ.stage='detected';log(S,'Integrity check run: readiness '+s.overall);toast('Detect finished: readiness '+s.overall);}
    else if(act==='rectify'){
      const r=fixAll(S.manuscript,S.runs,S.acks);
      if(!r.applied){toast('No automatic fixes left. Review the remaining findings.');return;}
      S.manuscript=r.text;S.fixes+=r.applied;S.integ.stage='rectified';log(S,'Applied '+r.applied+' fixes to the manuscript');toast('Applied '+r.applied+' fixes. Review the changes, then revalidate.');
    }else if(act==='revalidate'){const s=snapshotOf(live());S.integ.snap=s;S.integ.stage='revalidated';log(S,'Revalidated: readiness '+s.overall);toast('Revalidated: readiness '+s.overall);}
    else if(act==='fix'){
      const f=live().findings.find(x=>x.id===id);if(!f||!f.fix)return;
      const nt=f.fix.apply(S.manuscript);if(nt===S.manuscript){toast('That text is no longer in the draft.');return;}
      S.manuscript=nt;S.fixes++;S.integ.stage='rectified';log(S,'Applied fix: '+f.fix.label);toast('Fix applied. Revalidate when you are done.');
    }else if(act==='ack'){S.acks[id]=true;log(S,'Marked a citation as checked manually');toast('Marked as checked');}
    ta.value=S.manuscript;upd();save();draw();
  });
};

/* ================= Publish ================= */
const MANUAL=[['m-format','Manuscript follows the venue template','Use the template named for the selected venue'],['m-abs','Abstract fits the venue’s word limit',''],['m-ethics','Ethics, data availability and conflict statements added',''],['m-authors','Author names, affiliations and ORCID iDs are complete',''],['m-fig','Figures and tables are legible and numbered',''],['m-cover','Cover letter reviewed and personalised',''],['m-reviewers','Suggested reviewers listed, if the venue asks for them',''],['m-licence','Copyright or licence form ready','']];
function checklist(){
  const a=live(),v=S.integ,reval=v.stage==='revalidated'&&v.snap&&v.snap.hash===curHash();
  const nf=cat=>a.findings.filter(f=>f.cat===cat).length;
  const auto=[
   {id:'a-runs',label:'Experiment records exist',ok:S.runs.length>0,hint:S.runs.length+' runs recorded'},
   {id:'a-reval',label:'Draft revalidated after its last edit',ok:reval,hint:reval?'Readiness '+v.snap.overall:'Run Revalidate on the Integrity page'},
   {id:'a-high',label:'No high-severity findings open',ok:a.counts.high===0,hint:a.counts.high?a.counts.high+' open':'All clear'},
   {id:'a-cons',label:'Reported results match experiment records',ok:nf('Results consistency')===0,hint:nf('Results consistency')?nf('Results consistency')+' mismatches':'Every figure traced to a run'},
   {id:'a-cite',label:'Citations verified against sources',ok:nf('Citation accuracy')===0,hint:a.cites.verified+' of '+a.cites.total+' verified'},
   {id:'a-sim',label:'No uncited text overlap with the library',ok:!a.findings.some(f=>f.cat==='Similarity'&&f.sev!=='low'),hint:''},
   {id:'a-contrib',label:'Contribution statement present',ok:a.hasContrib,hint:''}
  ].map(x=>Object.assign(x,{manual:false}));
  return auto.concat(MANUAL.map(([id,label,hint])=>({id,label,hint,manual:true,ok:!!S.checks[id]})));
}
function coverLetter(v){
  const lines=S.manuscript.split('\n'),title=(lines[0]||'Untitled manuscript').trim();
  const m=S.manuscript.match(/^Abstract\s*\n([\s\S]*?)(?:\n\s*\n|$)/m);
  const abs=m?sentencesOf(m[1]).slice(0,2).join(' '):sentencesOf(S.manuscript).slice(1,3).join(' ');
  const L=Object.values(latestByModel(S.runs)).sort((a,b)=>b.metrics.f1-a.metrics.f1),b=L[0];
  return `Dear Editors,\n\nPlease consider the enclosed manuscript, “${title}”, for publication in ${v.name}.\n\n${abs}\n\n`+(b?`All quantitative results in the manuscript come from recorded experiment runs (best model: ${MODELS[b.model].lc}, F1 ${b.metrics.f1.toFixed(2)}). The draft was checked for citation accuracy and text overlap before submission.\n\n`:'')+`[Confirm before sending: the work is original and is not under review elsewhere.]\n\nSincerely,\n[Author name]\n[Affiliation and contact details]`;
}
function refList(){
  const seen=new Set(),out=[];
  parseCites(S.manuscript).forEach(c=>{const cand=(SURNAMES[c.surname.toLowerCase()]||[]).find(p=>p.year===c.year);if(cand&&!seen.has(cand.id)){seen.add(cand.id);const l=linksOf(cand).find(x=>x.label==='DOI')||linksOf(cand)[0];out.push(cand.authors+' ('+cand.year+'). '+cand.title+'. '+cand.venue+'.'+(l?' '+l.url:''));}});
  return out;
}
function reproRecord(){
  return JSON.stringify({dataset:{generator:'synthetic IoT flows',records:DATA_N,features:FEATURES,attackShare:DATA_ATTACK,datasetSeed:2026},runs:S.runs.map(r=>({id:r.id,model:MODELS[r.model].name,params:r.params,seed:r.seed,testShare:r.testFrac,metrics:{accuracy:+r.metrics.acc.toFixed(4),precision:+r.metrics.prec.toFixed(4),recall:+r.metrics.rec.toFixed(4),f1:+r.metrics.f1.toFixed(4)},record:r.rec}))},null,2);
}
PAGES.publish=function(el){

  <div class="pub"><section><div class="filters" id="vfilters"></div><div class="venues" id="venues"></div></section><section class="section-gap" id="vpanel" style="min-width:0"></section></div>`;

    $('#venues').innerHTML=fits.filter(x=>UI.vkind==='All'||x.v.type===UI.vkind).map(({v,fit})=>`<button class="venue ${UI.venueView===v.id?'on':''}" data-venue="${v.id}"><div class="top"><div><b>${esc(v.name)}</b><div class="muted" style="font-size:13px">${v.pub}</div></div><span style="display:flex;gap:6px"><span class="pill">${v.type}</span>${S.venue===v.id?'<span class="pill accent">Target</span>':''}</span></div><div class="fit"><span class="trk"><i style="width:${fit}%"></i></span><span>${fit}% scope match</span></div></button>`).join('');
  };
  const drawPanel=()=>{
    const v=VENUES.find(x=>x.id===UI.venueView),chk=checklist(),done=chk.filter(c=>c.ok).length;
    if(UI.draft[v.id]===undefined)UI.draft[v.id]=coverLetter(v);
    const refs=refList();
    $('#vpanel').innerHTML=`<div class="card pad"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><h2 style="font:400 28px/1.1 var(--font-display)">${esc(v.name)}</h2><p class="muted" style="margin-top:4px">${v.type} · ${v.pub}</p></div><button class="btn ${S.venue===v.id?'':'primary'}" data-target="${v.id}">${S.venue===v.id?'Target venue':'Target this venue'}</button></div>
      <h3 class="h3d" style="margin-top:16px;font-size:20px">Format</h3><p>${esc(v.tpl)}</p><ul style="margin:10px 0 0;padding-left:18px;display:grid;gap:5px">${v.notes.map(n=>`<li>${esc(n)}</li>`).join('')}<li>Confirm current page limits, deadlines and fees on the venue’s site.</li></ul></div>
    <div class="card pad"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h3 class="h3d" style="margin:0">Submission checklist</h3><span id="progress" class="pill ${done===chk.length?'good':''}">${done} of ${chk.length} complete</span></div>
      <ul class="checklist" style="margin-top:10px">${chk.map(c=>c.manual?`<li><input type="checkbox" id="${c.id}" data-check="${c.id}" ${c.ok?'checked':''}><label for="${c.id}">${esc(c.label)}${c.hint?`<small>${esc(c.hint)}</small>`:''}</label><span></span></li>`:`<li><span class="auto ${c.ok?'ok':'no'}" aria-label="${c.ok?'Passed':'Not met'}">${icon(c.ok?'check':'x',12)}</span><span>${esc(c.label)}<small>${esc(c.hint)}</small></span><span class="pill ${c.ok?'good':'warn'}">${c.ok?'Auto':'Open'}</span></li>`).join('')}</ul></div>
    <div class="card pad"><h3 class="h3d">Supporting documents</h3><div class="docs">
      <div><label class="f" for="cover">Cover letter draft</label><textarea id="cover" rows="12" style="margin-top:6px">${esc(UI.draft[v.id])}</textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-copy="cover">${icon('copy',14)} Copy letter</button><button class="btn sm ghost" data-regen>Regenerate from draft</button></div></div>
      <div class="doc"><div><b>Submission checklist</b><small>Plain text, with status of each item</small></div><button class="btn sm" data-copy="checklist">${icon('copy',14)} Copy</button></div>
      <div class="doc"><div><b>Reproducibility record</b><small>${S.runs.length} runs with settings, seeds and metrics (JSON)</small></div><button class="btn sm" data-copy="repro">${icon('copy',14)} Copy</button></div>
      <div class="doc"><div><b>Reference list</b><small>${refs.length} verified reference${refs.length===1?'':'s'}. Complete the author lists from each DOI record.</small></div><button class="btn sm" data-copy="refs" ${refs.length?'':'disabled'}>${icon('copy',14)} Copy</button></div></div></div>`;
  };
  drawList();drawPanel();
  el.addEventListener('input',e=>{if(e.target.id==='cover')UI.draft[UI.venueView]=e.target.value;});
  el.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.check;if(c){S.checks[c]=e.target.checked;save();const chk=checklist(),n=chk.filter(x=>x.ok).length,p=$('#progress');if(p){p.textContent=n+' of '+chk.length+' complete';p.className='pill'+(n===chk.length?' good':'');}}});
  el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.vk){UI.vkind=b.dataset.vk;drawList();}
    else if(b.dataset.venue){UI.venueView=b.dataset.venue;drawList();drawPanel();}
    else if(b.dataset.target){S.venue=b.dataset.target;log(S,'Targeted '+VENUES.find(x=>x.id===S.venue).name);save();drawList();drawPanel();toast('Target venue set');}
    else if('regen' in b.dataset){UI.draft[UI.venueView]=coverLetter(VENUES.find(x=>x.id===UI.venueView));drawPanel();}
    else if(b.dataset.copy){
      const k=b.dataset.copy;
      if(k==='cover')copyText($('#cover').value);
      else if(k==='checklist')copyText(checklist().map(c=>(c.ok?'[x] ':'[ ] ')+c.label).join('\n'));

    }
  });
};

<script>
/* IRIS backend bridge: usable from the UI or browser console. */
window.IRIS_API = {
  async request(path, options={}) {
    const response = await fetch('/api'+path, {
      credentials:'same-origin',
      headers:{'Content-Type':'application/json', ...(options.headers||{})},
      ...options
    });
    const data=await response.json().catch(()=>({error:'Invalid server response'}));
    if(!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  },
  health(){return this.request('/health')},
  searchPapers(q=''){return this.request('/papers?q='+encodeURIComponent(q))},
  ask(question, context=''){return this.request('/copilot',{method:'POST',body:JSON.stringify({question,context})})},
  runExperiment(config={}){return this.request('/experiments/run',{method:'POST',body:JSON.stringify(config)})},
  checkIntegrity(manuscript){return this.request('/integrity/check',{method:'POST',body:JSON.stringify({manuscript})})},
  rectify(manuscript){return this.request('/integrity/rectify',{method:'POST',body:JSON.stringify({manuscript})})},
  venues(){return this.request('/publication/venues')}
};
(async()=>{const el=document.getElementById('iris-api-status');try{await IRIS_API.health();el.textContent='IRIS API · online';el.style.color='var(--good)';el.title='Backend API is responding';}catch(e){el.textContent='IRIS API · start server';el.title='Run python app.py to enable backend endpoints';}})();
</script>
<script>
/* IRIS dynamic integration layer: replaces browser-only demo handlers with API-backed workflows. */
(function(){
  const $api=(p,o)=>window.IRIS_API.request(p,o);
  const esc2=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const json=o=>JSON.stringify(o);
  let projectId=null, syncTimer=null, integrityLast=null;
  const projectKey=()=> 'iris-server-project:'+((USER&&USER.email)||'guest');
  async function ensureProject(){
    if(!USER) return null;
    try{
      const saved=localStorage.getItem(projectKey());
      if(saved){projectId=Number(saved); const p=await $api('/projects/'+projectId); if(p&&p.state){
        const state=p.state;
        if(state.library) S.library=state.library;
        if(state.context) S.context=state.context;
        if(state.chat) S.chat=state.chat;
        if(state.runs) S.runs=state.runs;
        if(typeof state.manuscript==='string') S.manuscript=state.manuscript;
        if(state.integ) S.integ=state.integ;
        if(state.activity) S.activity=state.activity;
        if(state.checks) S.checks=state.checks;
        if(state.acks) S.acks=state.acks;
        if(state.venue) S.venue=state.venue;
        if(state.serverPapers) S.serverPapers=state.serverPapers;
        if(state.serverChat) S.serverChat=state.serverChat;
        if(state.serverExperiments) S.serverExperiments=state.serverExperiments;
        if(state.serverContext) S.serverContext=state.serverContext;
        if(state.uploadedDataset) S.uploadedDataset=state.uploadedDataset;
        return projectId;
      }}
    }catch(e){ projectId=null; }
    try{const p=await $api('/projects',{method:'POST',body:json({title:'My IRIS Research Workspace',state:serialState()})});projectId=p.id;localStorage.setItem(projectKey(),String(projectId));return projectId;}catch(e){return null;}
  }
  function serialState(){return {library:S?.library||[],context:S?.context||[],chat:S?.chat||[],runs:S?.runs||[],manuscript:S?.manuscript||'',integ:S?.integ||{},activity:S?.activity||[],checks:S?.checks||{},acks:S?.acks||{},venue:S?.venue||null,serverPapers:S?.serverPapers||[],serverChat:S?.serverChat||[],serverExperiments:S?.serverExperiments||[],serverContext:S?.serverContext||'',uploadedDataset:S?.uploadedDataset||null};}
  function syncProject(){
    if(!USER||!S)return;
    clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{
      try{await ensureProject();if(projectId)await $api('/projects/'+projectId,{method:'PUT',body:json({title:'My IRIS Research Workspace',state:serialState()})});}
      catch(e){console.warn('IRIS project sync:',e.message);}
    },450);
  }
  const oldSave=save;
  save=function(){oldSave();syncProject();};

  // Real backend account creation and login (password based; no fake OTP screen).
  authForm=function(){
    const signup=AUTH.mode==='signup';
    return `<div class="tabs" role="tablist"><button role="tab" aria-selected="${!signup}" class="${signup?'':'on'}" data-mode="signin">Sign in</button><button role="tab" aria-selected="${signup}" class="${signup?'on':''}" data-mode="signup">Create account</button></div>

    <form id="authForm" class="form-grid" novalidate>${AUTH.err?`<div class="err" role="alert">${esc2(AUTH.err)}</div>`:''}
    ${signup?`<label class="f" for="a-name">Full name<input type="text" id="a-name" autocomplete="name" value="${esc2(AUTH.name)}" placeholder="Your name" required></label>`:''}
    <label class="f" for="a-email">Email address<input type="email" id="a-email" autocomplete="email" value="${esc2(AUTH.email)}" placeholder="you@example.com" required></label>
    <label class="f" for="a-password">Password<input type="password" id="a-password" autocomplete="${signup?'new-password':'current-password'}" minlength="8" placeholder="At least 8 characters" required></label>
    <button class="btn primary" type="submit">${signup?'Create account':'Sign in'} ${icon('arrow',16)}</button></form>
    <p class="muted" style="font-size:13.5px">${signup?'Already registered?':'New to IRIS?'} <a href="#" data-mode="${signup?'signin':'signup'}">${signup?'Sign in':'Create an account'}</a></p>`;
  };
  authPage=function(){
    return `<div class="auth"><aside class="auth-side"><a class="brand" href="#home" data-go="home">${logo(34)}<span class="brand-name">IRIS</span></a><div><h2>Your research workspace, saved to your account.</h2><ul><li>${icon('check',16)}<span>Backend-backed sign-in and separate user accounts.</span></li><li>${icon('check',16)}<span>Saved workspace state, papers and experiment history.</span></li><li>${icon('check',16)}<span>Research modules that call the IRIS API.</span></li></ul></div><p class="faint" style="font-size:13px">Use an email and a password with at least 8 characters.</p></aside><main class="auth-main"><div class="auth-top"><button class="btn ghost sm" data-go="home">Back to site</button>${themeBtn()}</div><div class="card auth-card">${authForm()}</div></main></div>`;
  };
  bindAuth=function(){
    const root=$('.auth-card'); if(!root)return;
    root.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){e.preventDefault();AUTH.mode=m.dataset.mode;AUTH.err='';render();}});
    const f=$('#authForm'); if(!f)return;
    f.addEventListener('submit',async e=>{
      e.preventDefault(); const btn=f.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Connecting…';

        USER={name:data.user.name,email:data.user.email,org:'',created:Date.now()};setSession(USER.email);S=loadState();
        await ensureProject(); await syncProject();

  signOut=function(){
