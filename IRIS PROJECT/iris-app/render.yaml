# Render Blueprint: one web service that serves both the API and the website.
# Free Render services block SMTP ports, so send email with the resend or brevo provider (HTTPS APIs),
# or use a paid instance if you want Gmail SMTP. See README.md, "Deploy".
services:
  - type: web
    name: iris
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL        # PostgreSQL connection string, for example from Neon
        sync: false
      - key: EMAIL_PROVIDER      # resend or brevo on a free instance; smtp needs a paid instance
        value: resend
      - key: EMAIL_FROM          # an address on a domain you verified with the provider
        sync: false
      - key: RESEND_API_KEY      # or BREVO_API_KEY if you switch EMAIL_PROVIDER to brevo
        sync: false
      - key: GOOGLE_CLIENT_ID    # leave empty to hide the Google button
        sync: false
